<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BlackSignal – Intelligence Feed</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🛰️ BlackSignal</h1>
    <p class="tagline">Live Unfiltered Intel Feed</p>
  </header>

  <main>
    <input type="text" id="searchInput" placeholder="Search (e.g. BRICS, blackout, AI)" />
    <div id="feed">Loading feed...</div>
  </main>

  <footer>
    <p>⚠️ Powered by raw intelligence. Trust no one. Watch everything.</p>
  </footer>

  <script>
    const FEED_URL = "https://opensheet.elk.sh/1phTETapGGRdh8JF_RVxFP355n42qOib_vtsD6qxQLOI/Sheet1";

    async function fetchFeed() {
      const feedContainer = document.getElementById("feed");
      try {
        const res = await fetch(FEED_URL);
        const data = await res.json();
        feedContainer.innerHTML = "";
        data.forEach(item => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <h3>${item["Source Name"]}</h3>
            <p>${item["Summary"]}</p>
            <a href="${item["URL"]}" target="_blank">🔗 Read More</a>
            <p class="timestamp">${item["Timestamp"]}</p>
          `;
          feedContainer.appendChild(card);
        });
      } catch (err) {
        feedContainer.innerHTML = "<p>⚠️ Error loading feed.</p>";
        console.error(err);
      }
    }

    fetchFeed();

    document.getElementById("searchInput").addEventListener("input", function(e) {
      const keyword = e.target.value.toLowerCase();
      const cards = document.querySelectorAll(".card");
      cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(keyword) ? "block" : "none";
      });
    });
  </script>
</body>
</html>
